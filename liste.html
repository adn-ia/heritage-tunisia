<style>
:root{--ivory:#f6f0e4;--paper:#fffdf8;--ink:#2b2318;--stone:#8a7c66;--gold:#a8884f;--gold-soft:#c9ad79;--line:#e3d8c4;}
*{box-sizing:border-box;}
body{margin:0;font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:var(--ivory);line-height:1.55;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(43,35,24,.97);color:var(--ivory);padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.topbar a.back{color:var(--gold-soft);text-decoration:none;font-size:13px;letter-spacing:1px;}
.topbar .t{flex:1;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:17px;}
.topbar a.map{color:var(--gold-soft);text-decoration:none;font-size:13px;}

.filters{position:sticky;top:46px;z-index:18;background:var(--ivory);border-bottom:1px solid var(--line);padding:10px 14px;}
.filters .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:900px;margin:0 auto;}
#q{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:15px;background:#fff;}
.filters select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{border:none;background:#fff;padding:9px 12px;font-family:inherit;font-size:13.5px;cursor:pointer;color:var(--stone);}
.seg button.on{background:var(--gold);color:#fff;font-weight:600;}
.chk{display:flex;align-items:center;gap:5px;font-size:13.5px;color:var(--stone);cursor:pointer;}
.count{max-width:900px;margin:6px auto 0;font-size:12.5px;color:var(--stone);letter-spacing:.5px;}

.list{max-width:900px;margin:14px auto 60px;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.list{grid-template-columns:1fr;}}
.card{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  box-shadow:0 4px 14px rgba(44,33,26,.07);transition:transform .12s,box-shadow .12s;text-align:left;position:relative;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(44,33,26,.12);}
.card .th{width:96px;flex:0 0 96px;background:#efe6d4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold-soft);}
.card .bd{padding:11px 12px 12px;min-width:0;flex:1;}
.card .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;line-height:1.1;margin:0;}
.card .st{font-size:12.5px;color:var(--gold);font-style:italic;margin:2px 0;}
.card .mt{font-size:12px;color:var(--stone);letter-spacing:.3px;}
.empty{max-width:900px;margin:40px auto;text-align:center;color:var(--stone);font-style:italic;}
.card .pick{position:absolute;top:8px;right:8px;width:22px;height:22px;cursor:pointer;z-index:2;accent-color:var(--gold);}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#2b2318;color:var(--ivory);display:none;align-items:center;gap:10px;padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom, 0px));box-shadow:0 -4px 18px rgba(0,0,0,.3);flex-wrap:wrap;justify-content:center;}
.selbar.on{display:flex;}
.selbar b{font-size:14px;}
.selbar button{border:none;border-radius:8px;padding:11px 17px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.selbar button.sec{background:#f0e4d0;color:#2b2318;}
.selbar button.x{background:transparent;color:var(--gold-soft);padding:10px 6px;}

/* fiche modale */
.sheet-ov{position:fixed;inset:0;background:rgba(30,20,12,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.sheet-ov.on{display:flex;}
.sheet{background:var(--ivory);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);}
@media(min-width:680px){.sheet-ov{align-items:center;}.sheet{border-radius:14px;}}
.sheet .sh-img{width:100%;height:230px;object-fit:cover;display:block;background:#efe6d4;}
.sheet .sh-bd{padding:20px 22px 26px;}
.sheet .sh-close{position:sticky;top:14px;float:right;margin-right:16px;margin-bottom:-36px;z-index:20;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;z-index:2;}
.sheet h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:27px;margin:0 0 2px;}
.sheet .sh-st{color:var(--gold);font-style:italic;font-size:15px;margin-bottom:4px;}
.sheet .sh-mt{font-size:12.5px;color:var(--stone);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.sheet p.desc{font-size:16.5px;color:#33271c;margin:10px 0;}
.sheet .info{font-size:14.5px;margin:7px 0;color:#3a2c20;}
.sheet .info b{color:var(--gold);}
.sheet .amb{font-style:italic;background:#fbf3e8;border-left:3px solid var(--gold-soft);padding:9px 12px;border-radius:6px;margin-top:10px;font-size:15px;}
.sheet .leg{background:#f3eefb;border-left:3px solid #8a6fb0;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:15px;}
.sheet .leg .ln{font-size:11.5px;color:#8a7c9a;font-style:italic;}
.sheet .det{background:#eef6f0;border-left:3px solid #6f9c7a;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:15px;}
.sheet .warn{background:#fbf0e2;border:1px solid #e0b88c;border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:10px;}
.sheet .src{font-size:11.5px;color:var(--stone);font-style:italic;margin-top:14px;}
.sheet .sh-act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.sheet .sh-act a{flex:1;text-align:center;text-decoration:none;background:var(--gold);color:#fff;padding:11px;border-radius:8px;font-weight:600;font-size:14px;}
.sheet .sh-act a.sec{background:#efe6d4;color:var(--ink);}
.prem-ask{position:fixed;inset:0;z-index:9999;background:rgba(20,15,10,.55);display:flex;align-items:center;justify-content:center;padding:18px;}
.prem-ask .pa-card{background:#fffdf8;border-radius:12px;max-width:420px;width:100%;padding:22px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.prem-ask .pa-x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:19px;cursor:pointer;color:#8a7c66;}
.prem-ask .pa-t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;margin-bottom:5px;}
.prem-ask .pa-q{font-size:14px;color:#a8884f;margin-bottom:8px;}
.prem-ask .pa-d{font-size:14px;color:#6b5a39;line-height:1.6;margin-bottom:16px;}
.prem-ask .pa-go{display:block;text-align:center;background:#a8884f;color:#2b2318;text-decoration:none;padding:12px;border-radius:7px;font-size:15px;margin-bottom:8px;}
.prem-ask .pa-no{display:block;width:100%;background:none;border:1px solid #e3d8c4;color:#8a7c66;padding:11px;border-radius:7px;font-size:14.5px;cursor:pointer;}
</style>
  <script src="the-pass.js"></script>
</head>

<div class="topbar"><a class="back" href="decouvrir.html">‹ Menu</a><span class="t">TOUS LES LIEUX</span><a class="map" href="index.html">🗺️ Carte</a></div>

<div class="filters">
  <div class="row">
    <input id="q" type="search" placeholder="Rechercher un lieu…" autocomplete="off">

<div class="sheet-ov" id="sheetOv"><div class="sheet" id="sheet" style="position:relative;"></div></div>

<script src="the-i18n.js"></script>
<script>
function isPremium(){ try{return window.THEPass ? THEPass.isActive() : false;}catch(e){return false;} }

  /* AVERTISSEMENT PREMIUM — règle posée par Helmy le 15/08/2026.
     Au clic sur une fonction réservée, on EXPLIQUE et on laisse le choix :
     « Découvrir le Premium » ou « Plus tard ». « Plus tard » referme et laisse
     l'utilisateur exactement où il était — la navigation n'est jamais coupée.
     Patrimoine (veille citoyenne) reste libre quel que soit le statut de paiement. */
  function premAsk(quoi){
    if(document.getElementById('premAsk')) return;
    var d=document.createElement('div');
    d.id='premAsk'; d.className='prem-ask';
    d.innerHTML='<div class="pa-card">'
      + '<button class="pa-x" aria-label="'+uiT('Fermer')+'">✕</button>'
      + '<div class="pa-t">🔒 '+uiT('prem.ask.titre')+'</div>'
      + (quoi?'<div class="pa-q">'+quoi+'</div>':'')
      + '<div class="pa-d">'+uiT('prem.ask.detail')+'</div>'
      + '<a class="pa-go" href="premium.html">'+uiT('prem.ask.oui')+'</a>'
      + '<button class="pa-no">'+uiT('prem.ask.non')+'</button>'
      + '</div>';
    function ferme(){ var e=document.getElementById('premAsk'); if(e) e.remove(); }
    d.addEventListener('click',function(e){ if(e.target===d) ferme(); });
    document.body.appendChild(d);
    d.querySelector('.pa-x').onclick=ferme;
    d.querySelector('.pa-no').onclick=ferme;
  }
let ALL=[];
function getPicks(){ try{ return JSON.parse(localStorage.getItem('the_picks')||'[]'); }catch(e){ return []; } }
function setPicks(a){ try{ localStorage.setItem('the_picks', JSON.stringify(a)); }catch(e){} }
function togglePick(nm){ var p=getPicks(); if(p.indexOf(nm)>=0) p=p.filter(function(x){return x!==nm;}); else p.push(nm); setPicks(p); }
function norm(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function uiT(fr){ try{
    if(!window.THEi18n || !THEi18n.ui) return fr;
    /* une CLÉ abstraite (« prem.ask.titre ») se cherche dans TOUTES les langues,
       français compris ; un texte français reste traité à l'ancienne. */
    if(typeof fr==='string' && /^[a-z][a-z0-9]*(\.[a-z0-9]+)+$/.test(fr)){
      var v=THEi18n.ui(fr); return (v==null||v===fr) ? fr : v;
    }
    return (!THEi18n.isFr() && THEi18n.ui(fr)) || fr;
  }catch(e){ return fr; } }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// traduction du CONTENU (calage i18n THE : contenu par lieu dans i18n/<lang>.json, labels via lblI)
function trSite(p){ return (window.THEi18n && !THEi18n.isFr()) ? THEi18n.site(p.nom) : null; }
function trCat(v){ return (window.THEi18n && !THEi18n.isFr()) ? THEi18n.cat(v) : v; }
function lblI(key){ var FR={avoir:'À voir',conseil:'Conseil'};
  if(!window.THEi18n || THEi18n.isFr()) return FR[key];
  var M={avoir:{en:'See',it:'Da vedere',de:'Sehenswert',ar:'للمشاهدة'},conseil:{en:'Tip',it:'Consiglio',de:'Tipp',ar:'نصيحة'}};
  return (M[key]&&M[key][THEi18n.lang()])||FR[key]; }
// nature = genre OU categorie (calage : THE marque la nature par `categorie`, MHE par les deux)
function gen(s){ return (s.genre==='nature'||s.categorie==='nature')?'nature':'histoire'; }
function emoji(p){
  const h=norm((p.type||'')+' '+(p.nom||''));
  const has=(...k)=>k.some(x=>h.includes(x));
  if(gen(p)==='nature') return '🌿';
  if(has('synagogue','mellah','ghriba'))return'✡️'; if(has('mosquee','medersa','msid','minaret','zitouna'))return'🕌';
  if(has('zaoui','mausolee','tombeau','marabout','koubba','ribat'))return'🕌'; if(has('eglise','cathedrale','basilique'))return'⛪';
  if(has('porte','bab '))return'🚪'; if(has('kasbah','kasba','ksar','fort','borj'))return'🏰';
  if(has('rempart','muraille','enceinte','bastion','sqala'))return'🏰'; if(has('fontaine','seqqai','bassin','citerne'))return'⛲';
  if(has('medina','fondouk','souk'))return'🏘️'; if(has('amphitheatre','theatre','colisee','thermes','forum','capitole','temple','site antique','romain'))return'🏛️';
  if(has('palais','dar ','palace'))return'🏛️'; if(has('jardin'))return'🌳'; if(has('phare'))return'🗼';
  return '📍';
}
Promise.all([
  fetch('sites.geojson').then(r=>r.json()).catch(()=>({features:[]})),
  fetch('sites-nature.geojson').then(r=>r.json()).catch(()=>({features:[]})),
  (window.THEi18n?THEi18n.ready:Promise.resolve())
]).then(([h,n])=>{
  const take=(d)=>(d.features||[]).map(f=>({...f.properties, _c:f.geometry.coordinates}));
  ALL=take(h).concat(take(n));
  ALL.sort((a,b)=>(a.nom||'').localeCompare(b.nom||'','fr'));
  const regs=[...new Set(ALL.map(s=>s.gouvernorat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  const rsel=document.getElementById('region'); regs.forEach(r=>rsel.add(new Option(r,r)));
  const typs=[...new Set(ALL.map(s=>s.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  const tsel=document.getElementById('type'); typs.forEach(t=>tsel.add(new Option(trCat(t),t)));
  /* Menu THÈME aligné sur la CARTE : mêmes périodes, même découpage (celui de
     l'Institut national du patrimoine), mêmes libellés — tirés de HConf.themes,
     donc traduits. Avant, ce menu proposait la `categorie` avec des libellés
     écrits en dur, et la liste n'offrait aucun filtre par période alors que la
     carte en avait un. */
  const thsel=document.getElementById('theme');
  if(ALL.some(s=>gen(s)==='nature')) thsel.add(new Option(uiT('theme.nature'),'nature'));
  const _cpt=new Map();
  ALL.forEach(s=>{ if(gen(s)==='nature') return;
    themesOf(s).forEach(t=>_cpt.set(t,(_cpt.get(t)||0)+1)); });
  const _decl=(window.HConf&&HConf.themes)||[];
  _decl.forEach(t=>{ const n=_cpt.get(t.id)||0; if(n>=3) thsel.add(new Option(uiT(t.label),t.id)); });
  // « Autres lieux » — même entrée que sur la CARTE : sans elle, les lieux qui
  // n'entrent dans aucun thème seraient introuvables au filtre.
  if((_cpt.get('autres')||0)>0) thsel.add(new Option(uiT('theme.autres'),'autres'));
  // Thème pré-sélectionné par l'URL (?theme=…) — appliqué une fois les options peuplées
  var _urlTheme=new URLSearchParams(location.search).get('theme');
  if(_urlTheme){ F.theme=_urlTheme; thsel.value=_urlTheme; }
  render();
});
/* Thèmes d'un lieu : le champ `themes` des données (périodes de l'INP + transversaux),
   avec repli sur les mots-clés d'époque déclarés dans HConf.themes. Même règle que la carte. */
function themesOf(p){
  if(p && Array.isArray(p.themes) && p.themes.length) return p.themes;
  const e=norm(p&&p.epoque||'');
  const r=((window.HConf&&HConf.themes)||[]).filter(t=>t.kw && t.kw.length && t.kw.some(k=>e.includes(norm(k)))).map(t=>t.id);
  return r.length?r:['autres'];   // « Autres lieux »
}
let F={g:'all',q:'',region:'',type:'',theme:'',photo:false,around:false,center:null,radius:30};
function hav(a,b){ const R=6371,r=Math.PI/180,x=Math.sin((b[1]-a[1])*r/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin((b[0]-a[0])*r/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function pass(s){
  if(F.g!=='all' && gen(s)!==F.g) return false;
  if(F.region && s.gouvernorat!==F.region) return false;
  if(F.type && s.type!==F.type) return false;
  if(F.theme){ if(F.theme==='nature'){ if(gen(s)!=='nature') return false; }
               else if(themesOf(s).indexOf(F.theme)<0) return false; }
  if(F.photo && !(s.photo||'').startsWith('img/')) return false;
  if(F.around && F.center){ if(!s._c) return false; if(hav(F.center,s._c)>F.radius) return false; }
  if(F.q){ const q=norm(F.q); if(!norm(s.nom).includes(q) && !norm(s.gouvernorat).includes(q) && !norm(s.type).includes(q)) return false; }
  return true;
}
function render(){
  const list=document.getElementById('list'); const res=ALL.filter(pass);
  if(F.around && F.center) res.sort((a,b)=>hav(F.center,a._c)-hav(F.center,b._c));
  document.getElementById('count').textContent=res.length+' '+(res.length>1?uiT('lieux'):uiT('lieu'))+' · '+uiT('cliquez la fiche · cochez pour un itinéraire');
  document.getElementById('empty').style.display=res.length?'none':'block';
  list.innerHTML=res.map(s=>{
    const idx=ALL.indexOf(s);
    const th=(s.photo||'').startsWith('img/')?`<div class="th" style="background-image:url('${esc(s.photo)}')"></div>`:`<div class="th">${emoji(s)}</div>`;
    const sub=s.sous_titre?`<div class="st">${esc(s.sous_titre)}</div>`:'';
    return `<div class="card" data-i="${idx}" role="button" tabindex="0">${th}<div class="bd"><p class="nm">${esc(s.nom)}</p>${sub}<div class="mt">${esc(s.gouvernorat||'')}${trCat(s.type)?' · '+esc(trCat(s.type)):''}${(F.around&&F.center&&s._c)?' · ◎ '+Math.round(hav(F.center,s._c))+' km':''}</div></div><input type="checkbox" class="pick" data-i="${idx}" title="${uiT('Sélectionner pour un itinéraire')}"></div>`;
  }).join('');
  [...list.querySelectorAll('.card')].forEach(c=>c.onclick=e=>{ if(e.target.classList.contains('pick'))return; openSheet(ALL[+c.dataset.i]); });
  const _pk=getPicks();
  [...list.querySelectorAll('.pick')].forEach(cb=>{ const nm=ALL[+cb.dataset.i].nom; cb.checked=_pk.indexOf(nm)>=0; cb.onchange=()=>{ togglePick(nm); updateBar(); }; });
  updateBar();
}
function openSheet(s){
  /* RÈGLE (Helmy, 15/08/2026) : on parcourt la liste librement — titre et image —
     mais ouvrir la fiche est réservé au Premium. Le clic renvoie au paywall, qui
     explique et laisse revenir. Seul « Patrimoine » reste libre en permanence. */
  if(!isPremium()){ premAsk((s&&s.nom)||''); return; }
  const tr=trSite(s);
  const img=(s.photo||'').startsWith('img/')?`<img class="sh-img" src="${esc(s.photo)}" alt="">`:`<div class="sh-img" style="display:flex;align-items:center;justify-content:center;font-size:60px;color:var(--gold-soft)">${emoji(s)}</div>`;
  const mt=[s.gouvernorat,trCat(s.type),trCat(s.epoque)].filter(Boolean).join(' · ');
  let h=`<button class="sh-close" onclick="closeSheet()">✕</button>${img}<div class="sh-bd">`;
  if(s.sous_titre) h+=`<div class="sh-st">${esc(s.sous_titre)}</div>`;
  h+=`<h2>${esc(s.nom)}</h2>`+(isPremium()?`<div class="sh-mt">${esc(mt)}</div>`:'');
  const desc=(tr&&tr.d)||s.description;
  const av=(tr&&tr.a)||s.a_voir, cons=(tr&&tr.c)||s.conseil;
  if(isPremium()){
    if(desc){ h+=`<p class="desc">${desc}</p>`; if(window.THEFicheAudio) h+=THEFicheAudio.html(s.vkey,uiT('Écouter ce lieu')); }
    if(av) h+=`<p class="info">👁️ <b>${lblI('avoir')}</b> : ${av}</p>`;
    if(cons) h+=`<p class="info">💡 <b>${lblI('conseil')}</b> : ${cons}</p>`;
  }
  if(isPremium() && s.acces) h+=`<div class="warn">⚠️ ${esc(s.acces)}</div>`;
  if(isPremium() && s.ambiance) h+=`<div class="amb">✨ <b style="font-style:normal">L'instant</b> — ${esc(s.ambiance)}</div>`;
  const an=(tr&&tr.an)||s.anecdote;
  if(isPremium()) h+=`<div data-brique="legende" data-site="${esc(s.nom)}"></div>`;   // légende : premium
  if(an) h+= isPremium() ? `<div class="det">👁️ <b>Le détail</b> — ${an}</div>` : `<div class="det" onclick="premAsk('')" style="cursor:pointer">👁️ <b>Le détail</b> — ${String(an).replace(/<[^>]*>/g,'').slice(0,45).trim()}… <span style="color:#6f9c7a;font-weight:700;white-space:nowrap">🔒 Premium</span></div>`;
  if(isPremium() && s.source) h+=`<div class="src">Source : ${esc(s.source)}</div>`;
  if(s.photo_credit) h+=`<div class="src">📷 ${esc(s.photo_credit)}</div>`;
  const en=encodeURIComponent(s.nom);
  h+=`<div class="sh-act"><a href="index.html?route=${en}&from=liste">🗺️ Situer sur la carte</a><a href="itineraire.html?picks=${en}&from=liste">➕ Nouvel itinéraire</a><a class="sec" href="itineraire.html?picks=${en}&add=1&from=liste">➕ Ajouter au parcours</a></div>`;
  h+=`</div>`;
  document.getElementById('sheet').innerHTML=h; var _sp=document.getElementById('sh-pc'); if(_sp)_sp.onclick=function(){if(window.THEPostcard)THEPostcard.open(s.nom,s.gouvernorat||'');};
  if(window.THEi18n&&!THEi18n.isFr()&&THEi18n.applyUI) THEi18n.applyUI(document.getElementById('sheet'));
  document.getElementById('sheetOv').classList.add('on');
}
function closeSheet(){document.getElementById('sheetOv').classList.remove('on');}
document.getElementById('sheetOv').onclick=e=>{if(e.target.id==='sheetOv')closeSheet();};
document.getElementById('q').oninput=e=>{F.q=e.target.value;render();};
document.getElementById('region').onchange=e=>{F.region=e.target.value;render();};
document.getElementById('type').onchange=e=>{F.type=e.target.value;render();};
document.getElementById('theme').onchange=e=>{F.theme=e.target.value; render();};
document.getElementById('withPhoto').onchange=e=>{F.photo=e.target.checked;render();};
[...document.querySelectorAll('#genreSeg button')].forEach(b=>b.onclick=()=>{
  F.g=b.dataset.g; document.querySelectorAll('#genreSeg button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
function updateBar(){ const n=getPicks().length; document.getElementById('selcount').textContent=n+' '+(n>1?uiT('lieux'):uiT('lieu'))+' '+(n>1?uiT('sélectionnés'):uiT('sélectionné')); document.getElementById('selbar').classList.toggle('on',n>0); }
function selNames(){ return getPicks().map(encodeURIComponent).join('|'); }
document.getElementById('selNew').onclick=()=>{ if(getPicks().length) location.href='itineraire.html?picks='+selNames()+'&from=liste'; };
document.getElementById('selAdd').onclick=()=>{ if(getPicks().length) location.href='itineraire.html?picks='+selNames()+'&add=1&from=liste'; };
document.getElementById('selClear').onclick=()=>{ setPicks([]); render(); };
function activateAround(){
  const b=document.getElementById('aroundBtn');
  if(!navigator.geolocation){ alert(uiT('Géolocalisation indisponible sur cet appareil.')); return; }
  b.textContent='📍 '+uiT('Localisation…');
  navigator.geolocation.getCurrentPosition(pos=>{
    F.around=true; F.center=[pos.coords.longitude,pos.coords.latitude];
    b.textContent='📍 '+uiT('Autour de moi')+' ✓'; b.style.background='var(--gold)'; b.style.color='#fff';
    document.getElementById('radiusRow').style.display='flex'; render();
  }, ()=>{ b.textContent='📍 '+uiT('Autour de moi'); alert(uiT('Localisation refusée ou indisponible.')); });
}
document.getElementById('aroundBtn').onclick=activateAround;
document.getElementById('radius').oninput=e=>{ F.radius=+e.target.value; document.getElementById('radiusVal').textContent=e.target.value; render(); };
document.getElementById('aroundOff').onclick=()=>{ F.around=false; F.center=null; document.getElementById('radiusRow').style.display='none'; const b=document.getElementById('aroundBtn'); b.textContent='📍 '+uiT('Autour de moi'); b.style.background=''; b.style.color='var(--ink)'; render(); };
if(new URLSearchParams(location.search).get('around')==='1') activateAround();
</script>

<script>
/* ON COMPOSE UN ITINÉRAIRE QUI A DÉJÀ UN NOM
   On arrive ici depuis « Composer » après l'avoir nommé. Les boutons disaient
   « Nouvel itinéraire » et « Au parcours » : rien ne rappelait POUR QUOI on
   choisissait des lieux, et l'itinéraire qu'on venait de nommer semblait perdu.
   Ils portent son nom, et le second — qui vise un parcours en cours — s'efface,
   puisque le parcours en cours, c'est justement celui-là. */
(function(){
  var nom=''; try{ nom=sessionStorage.getItem('the_nom_attente')||''; }catch(e){}
  if(!nom) return;
  function T(k,d){ var v=(window.THEi18n&&THEi18n.ui&&THEi18n.ui(k)); return (v&&v!==k)?v:d; }
  function poser(){
    var principal=document.getElementById('selNew'),
        second=document.getElementById('selAdd');
    if(!principal) return false;
    principal.textContent=T('picks.ajouter.a','➕ Ajouter à « {n} »').split('{n}').join(nom);
    principal.removeAttribute('data-i18n');          // sinon l'i18n réécrit par-dessus
    if(second) second.style.display='none';
    return true;
  }
  if(!poser()){ var n=0, t=setInterval(function(){ n++; if(poser()||n>40) clearInterval(t); }, 250); }
  else { setTimeout(poser, 1200); }                  // l'i18n s'applique après : on repasse
})();
</script>
