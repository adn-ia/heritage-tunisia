<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26201a">
<title data-i18n="patrimoine.titre">Patrimoine</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ivory:#f6f0e4;--paper:#fffdf8;--ink:#2b2318;--stone:#8a7c66;--gold:#a8884f;--gold-soft:#c9ad79;--line:#e3d8c4;
      --peril:#a5432f;--moyen:#b9862f;--bon:#5c7a52;}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:var(--ivory);line-height:1.6;}
a{color:inherit;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(38,32,26,.97);color:var(--ivory);
  padding:11px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.topbar a.back{color:var(--gold-soft);text-decoration:none;font-size:13px;letter-spacing:1px;white-space:nowrap;}
.topbar .brand{flex:1;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:16px;text-transform:uppercase;}
.topbar .lang{display:flex;gap:6px;}
.topbar .lang button{background:none;border:1px solid rgba(201,173,121,.4);color:var(--gold-soft);
  font:inherit;font-size:12px;letter-spacing:1px;padding:3px 9px;border-radius:20px;cursor:pointer;text-transform:uppercase;}
.topbar .lang button.on{background:var(--gold-soft);color:#2b2318;border-color:var(--gold-soft);}
main{max-width:940px;margin:0 auto;padding:26px 20px 70px;}
.kicker{font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.04;margin:0 0 10px;}
.lead{font-style:italic;color:var(--stone);max-width:640px;font-size:17px;margin:0 0 22px;}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0 0 26px;padding:0 0 22px;border-bottom:1px solid var(--line);}
.stats .s{display:flex;align-items:baseline;gap:8px;}
.stats .s b{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;}
.stats .s.peril b{color:var(--peril);}
.stats .s span{font-size:14px;color:var(--stone);letter-spacing:.3px;}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 8px;}
.filters input[type=search],.filters select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;}
.filters input[type=search]{flex:1;min-width:220px;}
.filters label.chk{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;color:var(--stone);cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
.count{font-size:13px;color:var(--stone);letter-spacing:.4px;margin:6px 2px 14px;}
.exportbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 20px;padding:11px 14px;background:#fbf6ec;border:1px solid var(--line);border-radius:10px;}
.exportbar .exlabel{font-size:13px;color:var(--stone);letter-spacing:.5px;margin-right:2px;}
.exportbar button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--gold-soft);border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .12s;}
.exportbar button:hover{background:var(--gold-soft);}
.exportbar button.off{opacity:.45;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:16px 16px 15px 20px;cursor:pointer;overflow:hidden;box-shadow:0 3px 12px rgba(43,35,24,.05);
  transition:transform .12s ease,box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(43,35,24,.10);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stone);}
.card.peril::before{background:var(--peril);} .card.moyen::before{background:var(--moyen);} .card.bon::before{background:var(--bon);}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;margin:0 0 3px;line-height:1.12;}
.card .loc{font-size:13.5px;color:var(--stone);margin:0 0 11px;}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11.5px;letter-spacing:.4px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--stone);background:#fbf6ec;}
.tag.etat{color:#fff;border:none;}
.tag.etat.peril{background:var(--peril);} .tag.etat.moyen{background:var(--moyen);} .tag.etat.bon{background:var(--bon);} .tag.etat.na{background:var(--stone);}
.tag.classe{border-color:var(--gold-soft);color:var(--gold);background:#fbf3e8;}
.empty{text-align:center;color:var(--stone);font-style:italic;padding:60px 0;}
/* modale */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(30,24,16,.55);}
.modal.on{display:flex;}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:26px 24px 30px;box-shadow:0 -10px 40px rgba(0,0,0,.3);}
@media(min-width:640px){.modal{align-items:center;} .sheet{border-radius:16px;}}
.sheet .close{float:right;background:none;border:none;font-size:22px;color:var(--stone);cursor:pointer;line-height:1;}
.sheet h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;margin:0 8px 2px 0;line-height:1.08;}
.sheet .sub{color:var(--stone);font-size:14.5px;margin:0 0 18px;}
.rows{margin:0 0 18px;border-top:1px solid var(--line);}
.rows .r{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;}
.rows .r .k{color:var(--stone);}
.rows .r .v{text-align:right;font-weight:600;}
.sheet .maplink{display:inline-block;color:var(--gold);text-decoration:none;font-size:15px;margin:0 8px 16px 0;}
.sheet .signaler{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-size:15px;font-weight:600;
  padding:9px 16px;border-radius:8px;margin:0 0 16px;}
.sheet .soon{background:#fbf3e8;border-left:3px solid var(--gold-soft);padding:11px 14px;border-radius:6px;font-size:14px;color:#5a4d3a;margin:0 0 12px;}
.sheet .src{font-size:12px;color:var(--stone);}
.loading{text-align:center;color:var(--stone);font-style:italic;padding:70px 0;}
/* Feed contributions (F1) */
#feed{margin-top:40px;border-top:1px solid var(--line);padding-top:22px;}
.feed-h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;margin:0 0 4px;}
.feed-sub{color:var(--stone);font-style:italic;font-size:14.5px;margin:0 0 16px;}
.fb-note{color:var(--stone);font-style:italic;text-align:center;padding:26px 0;}
.fb-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin:0 0 13px;box-shadow:0 3px 12px rgba(43,35,24,.05);}
.fb-top{display:flex;align-items:center;gap:10px;justify-content:space-between;}
.fb-top b{font-family:'Cormorant Garamond',serif;font-size:19px;}
.fb-badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.fb-badge.attente{background:#f5ead2;color:#8a6d1f;}
.fb-badge.valide{background:#e3efe4;color:#3f7a4a;}
.fb-badge.rejete{background:#f0e0da;color:#9a4a34;}
.fb-gov{font-size:13px;color:var(--stone);margin-top:2px;}
.fb-obs{font-size:15.5px;margin:9px 0;}
.fb-photo{display:inline-block;font-size:13.5px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;}
.fb-meta{font-size:12.5px;color:var(--stone);margin-top:9px;}
.fb-ctoggle{appearance:none;background:none;border:none;color:var(--gold);font:inherit;font-size:13.5px;cursor:pointer;padding:8px 0 0;text-decoration:underline;}
.fb-comments{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.fb-c{margin:0 0 9px;}
.fb-cauthor{font-weight:700;font-size:14px;} .fb-crole{font-style:italic;font-weight:400;color:var(--gold);font-size:12px;}
.fb-cdate{font-size:11.5px;color:var(--stone);margin-left:8px;}
.fb-c p{margin:2px 0 0;font-size:14.5px;}
.fb-cempty{font-size:13px;color:var(--stone);font-style:italic;margin-bottom:8px;}
.fb-cform{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.fb-cform input,.fb-cform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--ivory);}
.fb-cform .fb-cnom,.fb-cform .fb-cmail{flex:1;min-width:130px;}
.fb-cform .fb-ctext{flex-basis:100%;min-height:52px;resize:vertical;}
.fb-csend{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.fb-cmsg{font-size:12.5px;color:var(--peril,#a5432f);align-self:center;}
/* Onglets Sites / Contributions */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;}
.ptab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;font:inherit;font-size:15px;
  color:var(--stone);padding:9px 16px;cursor:pointer;margin-bottom:-1px;}
.ptab:hover{color:var(--ink);}
.ptab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}
.addsite{display:inline-flex;align-items:center;gap:9px;text-decoration:none;background:#fbf3e8;border:1px dashed var(--gold-soft);
  border-radius:10px;padding:12px 16px;color:#5a4d3a;font-size:15px;margin:0 0 16px;transition:background .15s;}
.addsite:hover{background:#f6ead4;}
.addsite-ic{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--gold);color:#241c12;font-weight:700;font-size:16px;flex:none;}
/* Bouton connexion admin */
.authbtn{margin-left:auto;align-self:center;display:flex;align-items:center;gap:8px;}
.auth-who{font-size:12.5px;color:var(--stone);}
.auth-b{appearance:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
.auth-key{appearance:none;background:none;border:none;font-size:15px;cursor:pointer;opacity:.45;padding:4px;line-height:1;}
.auth-key:hover{opacity:1;}
.auth-form{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.auth-form[hidden]{display:none;}
.auth-form input{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:135px;background:#fff;}
.af-msg{font-size:11.5px;color:var(--stone);}
.auth-b:hover{background:var(--paper);}
/* Liste linéaire des contributions */
.fb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 9px;cursor:pointer;font:inherit;}
.fb-row:hover{border-color:var(--gold-soft);box-shadow:0 2px 10px rgba(43,35,24,.06);}
.fb-row-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.fb-row-main b{font-family:'Cormorant Garamond',serif;font-size:18px;}
.fb-ref{font-size:12px;color:var(--stone);}
.fb-row-meta{display:flex;align-items:center;gap:10px;flex:none;}
.fb-row-date{font-size:12px;color:var(--stone);}
/* Carte */
#patMap{height:min(70vh,560px);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.map-note{font-size:12.5px;color:var(--stone);font-style:italic;margin:10px 0 0;}
.leaflet-popup-content{font-family:'EB Garamond',Georgia,serif;font-size:13.5px;}
.leaflet-popup-content a{color:var(--gold);}
/* Modale contribution (grande, pas plein écran) */
.cmodal{position:fixed;inset:0;z-index:1000;background:rgba(20,15,10,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
.cmodal[hidden]{display:none;}
.cmodal-box{background:var(--ivory);border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;position:relative;box-shadow:0 24px 70px rgba(20,15,10,.5);}
.cmodal-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:26px;line-height:1;color:var(--stone);cursor:pointer;z-index:2;}
.cmodal-body{padding:22px 22px 24px;}
.cm-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-right:28px;}
.cm-head h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;margin:0;}
.cm-ref,.cm-etat{font-size:13.5px;color:var(--stone);margin-top:3px;}
.cm-obs{font-size:16px;margin:12px 0;}
.cm-meta{font-size:12.5px;color:var(--stone);}
.cm-reason{background:#f0e0da;border-left:3px solid var(--peril,#a5432f);padding:9px 12px;border-radius:6px;font-size:13.5px;margin:10px 0;}
.cm-admin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px;padding:12px;background:#f3ede0;border:1px solid var(--line);border-radius:10px;}
.cm-admin-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep,#8a6d3a);font-weight:700;width:100%;}
.cm-btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.cm-btn:hover{background:var(--paper);}
.cm-btn.ok{background:#e3efe4;border-color:#bcd6c1;color:#3f7a4a;}
.cm-btn.no{background:#f5ead2;border-color:#e6d3a2;color:#8a6d1f;}
.cm-btn.danger{background:#f0e0da;border-color:#e2bcae;color:#9a4a34;}
.cm-edit{display:flex;flex-direction:column;gap:5px;margin:10px 0;padding:12px;background:#fffdf8;border:1px dashed var(--gold-soft);border-radius:10px;}
.cm-edit label{font-size:12px;color:var(--stone);}
.cm-edit input,.cm-edit textarea{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--ivory);}
.cm-edit textarea{min-height:70px;resize:vertical;}
.cm-edit-act{flex-direction:row;display:flex;gap:8px;margin-top:4px;}
.cm-comments{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
.cm-comments h3{font-family:'Cormorant Garamond',serif;font-size:18px;margin:0 0 8px;}
.cm-clist{margin-bottom:10px;}
.cm-cform{display:flex;flex-wrap:wrap;gap:7px;}
.cm-cform input,.cm-cform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);}
.cm-cnom,.cm-cmail{flex:1;min-width:130px;}
.cm-ctext{flex-basis:100%;min-height:52px;resize:vertical;}
.cm-csend{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.cm-cmsg{font-size:12.5px;color:var(--peril,#a5432f);align-self:center;}
/* Panneau Partager (Mère) */
.share-panel{background:#f3ede0;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:0 0 16px;}
.share-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold-deep,#8a6d3a);margin-bottom:8px;}
.share-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;}
.share-lbl{font-size:13px;font-weight:600;min-width:64px;}
.share-row code{font-size:12.5px;background:#fffdf8;border:1px solid var(--line);border-radius:6px;padding:5px 9px;flex:1;min-width:180px;overflow:auto;white-space:nowrap;}
.share-b{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none;}
.share-note{font-size:12px;color:var(--stone);font-style:italic;margin-top:6px;}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../decouvrir.html" data-i18n="patrimoine.retour">‹ Menu</a>
    <span class="brand" data-i18n="patrimoine.marque">Patrimoine</span>
    <span class="lang" id="langSw"></span>
  </div>

  <main>
    <p class="kicker" data-i18n="patrimoine.kicker">Veille citoyenne du patrimoine</p>
    <h1 data-i18n="patrimoine.h1">Le patrimoine, sous nos yeux</h1>
    <p class="lead" data-i18n="patrimoine.lead"></p>

    <div class="stats" id="stats"></div>

    <nav class="ptabs">
      <button class="ptab on" type="button" data-pane="sites" data-i18n="patrimoine.tab.sites">Sites</button>
      <button class="ptab" type="button" data-pane="carte" data-i18n="patrimoine.tab.carte">Carte</button>
      <button class="ptab" type="button" data-pane="contrib" data-i18n="patrimoine.tab.contrib">Contributions</button>
      <button class="ptab" type="button" data-pane="statuts" data-i18n="patrimoine.tab.statuts">Statuts</button>
      <span id="authBtn" class="authbtn"></span>
    </nav>

    <div id="pane-sites">
    <a class="addsite" href="contribuer.html"><span class="addsite-ic">＋</span><span data-i18n="patrimoine.addsite">Un site manque à la liste ? Signalez-le</span></a>

    <div class="filters">
      <input type="search" id="q" data-i18n-ph="patrimoine.filtre.recherche">
      <select id="fGov"></select>
      <select id="fEtat"></select>
      <label class="chk"><input type="checkbox" id="fClasse"> <span data-i18n="patrimoine.filtre.classe"></span></label>
    </div>
    <div class="count" id="count"></div>

    <div class="exportbar">
      <span class="exlabel" data-i18n="patrimoine.export.titre">Exporter le dossier :</span>
      <button id="exPDF" data-i18n="patrimoine.export.pdf">Imprimer / PDF</button>
      <button id="exHTML" data-i18n="patrimoine.export.html">Télécharger (HTML)</button>
      <button id="exINP" data-i18n="patrimoine.export.inp">✉ Transmettre (e-mail)</button>
    </div>

    <div class="grid" id="list"></div>
    <div class="loading" id="loading">…</div>
    <div class="empty" id="empty" style="display:none" data-i18n="patrimoine.vide"></div>
    </div><!-- /pane-sites -->

    <div id="pane-carte" hidden>
      <div id="patMap"></div>
      <p class="map-note" data-i18n="patrimoine.carte.note"></p>
    </div>

    <div id="pane-contrib" hidden>
      <div id="sharePanel" class="share-panel" hidden></div>
      <section id="feed">
        <h2 class="feed-h" data-i18n="patrimoine.feed.titre">Contributions de la communauté</h2>
        <p class="feed-sub" data-i18n="patrimoine.feed.sous"></p>
        <a class="addsite" href="contribuer.html"><span class="addsite-ic">＋</span><span data-i18n="patrimoine.addsite">Un site manque à la liste ? Signalez-le</span></a>
        <div id="feedList"></div>
      </section>
    </div>

    <div id="pane-statuts" hidden>
      <section id="statutsSec">
        <h2 class="feed-h" data-i18n="patrimoine.statuts.titre">Statuts des contributions</h2>
        <p class="feed-sub" data-i18n="patrimoine.statuts.sous"></p>
        <div id="statutsList"></div>
      </section>
    </div>
  </main>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

  <!-- Firebase (SDK compat) — UNIQUEMENT patrimoine. Inerte si config vide. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="i18n/engine.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
  <script src="feed.js"></script>
  <script>
  /* Onglets Sites / Carte / Contributions / Statuts (deep-link #carte, #contrib, #statuts) */
  (function(){
    var tabs = document.querySelectorAll('.ptab');
    var panes = { sites:'pane-sites', carte:'pane-carte', contrib:'pane-contrib', statuts:'pane-statuts' };
    function show(pane){
      Object.keys(panes).forEach(function(k){ var el=document.getElementById(panes[k]); if(el) el.hidden = (k !== pane); });
      tabs.forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-pane') === pane); });
      if(pane === 'carte' && window.PatMap) PatMap.show();
      try{ history.replaceState(null, '', pane === 'sites' ? location.pathname : '#'+pane); }catch(e){}
    }
    tabs.forEach(function(t){ t.addEventListener('click', function(){ show(t.getAttribute('data-pane')); }); });
    var h = (location.hash||'').replace('#',''); if(panes[h]) show(h);
  })();
  </script>
</body>
</html>
