<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THE">
<meta name="theme-color" content="#1a140d">
<title>Rome en Afrique — Immersion (THE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9ad79;--ivory:#f6f0e4;}
*{box-sizing:border-box;margin:0;}
html,body{height:100%;background:#0e0a06;overflow:hidden;font-family:'EB Garamond',Georgia,serif;color:#fff;}
#stage{position:fixed;inset:0;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;}
.slide.on{opacity:1;}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);}
.slide.on .bg{animation:kb 12s linear forwards;}
@keyframes kb{from{transform:scale(1.04);}to{transform:scale(1.16);}}
.slide .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,4,.45) 0%,rgba(10,7,4,.05) 28%,rgba(10,7,4,.15) 55%,rgba(10,7,4,.88) 100%);}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 26px 56px;max-width:860px;margin:0 auto;}
.cap .kick{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;opacity:0;transform:translateY(10px);}
.cap h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.02;text-shadow:0 2px 22px rgba(0,0,0,.7);opacity:0;transform:translateY(12px);}
.cap p{font-size:clamp(16px,2.6vw,20px);line-height:1.55;color:#f1e8d8;margin-top:12px;max-width:680px;text-shadow:0 1px 10px rgba(0,0,0,.8);opacity:0;transform:translateY(12px);}
.cap .src{font-size:11px;color:#b7a888;font-style:italic;margin-top:12px;opacity:0;}
.slide.on .cap .kick{animation:rise .9s .3s ease forwards;}
.slide.on .cap h2{animation:rise .9s .5s ease forwards;}
.slide.on .cap p{animation:rise 1s .8s ease forwards;}
.slide.on .cap .src{animation:fade 1s 1.4s ease forwards;}
@keyframes rise{to{opacity:1;transform:none;}}
@keyframes fade{to{opacity:1;}}
/* intro / outro (sans photo) */
.slide.text{background:radial-gradient(120% 90% at 50% 30%,#2a2014 0%,#0e0a06 70%);}
.slide.text .cap{position:static;display:flex;flex-direction:column;justify-content:center;height:100%;text-align:center;margin:0 auto;}
.slide.text h2{font-size:clamp(34px,8vw,64px);}
.slide.text .mark{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;opacity:0;animation:fade 1s .2s forwards;}
/* barre de progression + contrôles */
#bar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:30;box-shadow:0 0 8px rgba(201,173,121,.6);}
.ctl{position:fixed;z-index:40;background:rgba(20,15,9,.5);border:1px solid rgba(201,173,121,.4);color:var(--ivory);
  backdrop-filter:blur(4px);border-radius:30px;cursor:pointer;font-family:inherit;}
#prev,#next{top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:20px;line-height:1;}
#prev{left:14px;}#next{right:14px;}
#topctl{top:14px;right:14px;display:flex;gap:8px;}
#topctl button{width:42px;height:42px;font-size:17px;}
#playpause{font-size:16px;}
#counter{position:fixed;bottom:16px;right:18px;z-index:40;font-size:12px;color:#b7a888;letter-spacing:1px;}
#hint{position:fixed;bottom:16px;left:18px;z-index:40;font-size:12px;color:#b7a888;font-style:italic;}
a.exit{position:fixed;top:16px;left:16px;z-index:40;color:var(--gold);text-decoration:none;font-size:13px;letter-spacing:1px;
  background:rgba(20,15,9,.5);border:1px solid rgba(201,173,121,.3);border-radius:20px;padding:7px 13px;backdrop-filter:blur(4px);}
@media (prefers-reduced-motion:reduce){.slide.on .bg{animation:none;}}
</style>
  <script src="the-i18n.js"></script>
  <script src="the-pass.js"></script>
</head>
<body>
<a class="exit" href="decouvrir.html">‹ Quitter</a>
<div id="bar"></div>
<div id="stage"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b7a888" id="loading">Chargement de l'immersion…</div></div>
<button class="ctl" id="prev" title="Précédent">‹</button>
<button class="ctl" id="next" title="Suivant">›</button>
<div id="topctl">
  <button class="ctl" id="sound" title="Musique de fond">🔇</button>
  <button class="ctl" id="playpause" title="Lecture / pause">⏸</button>
</div>
<div id="counter"></div>
<div id="hint">Touchez pour avancer · maintenez pour mettre en pause</div>

<!-- Musique de fond : déposez un fichier « immersion-rome.mp3 » dans le dossier (libre de droits / CC).
     Tant qu'il est absent, le bouton son reste sans effet. -->
<audio id="bgm" loop preload="none"><source src="immersion-rome.mp3" type="audio/mpeg"></audio>

<script>
  // Récit liminaire + séquence (lieux RÉELS de la base, dans un ordre narratif).
  // Sous-titres = descriptions sourcées (chargées depuis sites.geojson). Narratif de liaison = histoire établie.
  const INTROS = [
    { type:'text', mark:'Tunisia Heritage — Immersion', titre:'Rome en Afrique',
      texte:'Un voyage à travers l\'Africa romaine, telle que la Tunisie la porte encore — de la mer au seuil du désert.' },
    { type:'text', mark:'146 av. J.-C. — 439 apr. J.-C.', titre:'L\'Africa Proconsulaire',
      texte:'Après la destruction de Carthage en 146 av. J.-C., Rome fonde la province d\'Africa, bientôt dite « proconsulaire ». Terre du blé et de l\'huile d\'olive, elle devient l\'un des greniers et l\'une des provinces les plus riches de l\'Empire — pavée de routes, semée de cités.' },
    { type:'text', mark:'Le cœur de la province', titre:'La Tunisie antique',
      texte:'C\'est ici, sur le sol de la Tunisie actuelle, que bat le cœur de l\'Africa : des dizaines de cités à capitole, théâtres et thermes, des mosaïques par milliers, et une frontière — le limes — qui veille face au Sahara. Laissez-vous porter, image après image.' }
  ];
  const OUTRO = { type:'text', mark:'Fin de l\'immersion', titre:'…jusqu\'au seuil du désert',
    texte:'De Carthage au limes saharien, l\'Africa romaine a laissé des pierres que le pays porte encore. À vous, maintenant, d\'aller les lire sur place.' };
  // ordre narratif : la capitale → les grandes cités du Tell → le Sud et la frontière
  const SEQ = [
    // — La capitale —
    {nom:'Carthage', act:'La capitale'},
    {nom:'Byrsa', act:'La capitale'},
    {nom:'Thermes d\'Antonin', act:'La capitale'},
    {nom:'Amphitheatre de Carthage', act:'La capitale'},
    {nom:'Citernes de La Malga', act:'La capitale'},
    {nom:'Oudhna (Uthina)', act:'Autour de Carthage'},
    {nom:'Pupput', act:'Autour de Carthage'},
    {nom:'Neapolis (Nabeul)', act:'Les ports'},
    {nom:'Utique (Utica)', act:'Les ports'},
    // — Les grandes cités du Tell —
    {nom:'Bulla Regia', act:'Les grandes cités du Tell'},
    {nom:'Chemtou (Simitthus)', act:'Les grandes cités du Tell'},
    {nom:'Pont de Trajan (Chemtou)', act:'Les grandes cités du Tell'},
    {nom:'Thuburnica', act:'Les grandes cités du Tell'},
    {nom:'Thignica (Ain Tounga)', act:'Les grandes cités du Tell'},
    {nom:'Uchi Maius (Henchir-Ed-Douames)', act:'Les grandes cités du Tell'},
    {nom:'Dougga (Thugga)', act:'Dougga, la mieux conservée'},
    {nom:'Capitole de Dougga', act:'Dougga, la mieux conservée'},
    {nom:'Theatre de Dougga', act:'Dougga, la mieux conservée'},
    {nom:'Musti (Mustis)', act:'Sur la grande voie'},
    {nom:'Thuburbo Majus', act:'Sur la grande voie'},
    // — Les hautes plaines —
    {nom:'Sicca Veneria (Le Kef antique)', act:'Les hautes plaines'},
    {nom:'Hammam Mellegue (thermes romains)', act:'Les hautes plaines'},
    {nom:'Makthar (Mactaris)', act:'Les hautes plaines'},
    {nom:'Sbeitla (Sufetula)', act:'Les hautes plaines'},
    {nom:'Capitole de Sbeitla', act:'Les hautes plaines'},
    {nom:'Haidra (Ammaedara)', act:'Les hautes plaines'},
    // — L'eau, le blé, l'huile —
    {nom:'Temple des Eaux de Zaghouan', act:'L\'eau et l\'abondance'},
    {nom:'Amphitheatre d\'El Jem (Thysdrus)', act:'L\'eau et l\'abondance'},
    {nom:'Hadrumete (Hadrumetum, Sousse antique)', act:'Le Sahel antique'},
    {nom:'Salakta (Sullecthum)', act:'Le Sahel antique'},
    {nom:'Basilique Saint-Pierre (Dar El Kous, Le Kef)', act:'Les premiers chrétiens'},
    {nom:'Catacombes de Sousse', act:'Les premiers chrétiens'},
    // — Vers le Sud et la frontière —
    {nom:'Gightis (Gigthis)', act:'Vers le Sud'},
    {nom:'Meninx', act:'Vers le Sud'},
    {nom:'Piscines romaines de Gafsa', act:'Vers le Sud'},
    {nom:'Tisavar (Ksar Rhilane)', act:'La frontière du désert'},
    {nom:'Limes Tripolitanus (frontiere saharienne)', act:'La frontière du désert'}
  ];
  const VOICE = false;   // passez à true quand vous aurez ajouté les voix ElevenLabs (voix-rome/0.mp3, 1.mp3, …)
  const DURATION = 9000; // ms par image

  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const big=u=>!u?'':(/\?width=\d+/.test(u)?u.replace(/\?width=\d+/,'?width=1280'):u+(u.includes('?')?'&':'?')+'width=1280');
  const wm=f=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=1280';
  // angles supplémentaires (vraies photos Wikimedia Commons, vérifiées) — chaque angle décrit
  const EXTRA = {
    'Dougga (Thugga)':[
      {f:'Dougga-forum.JPG', cap:'Le forum, cœur civique de la cité, bordé de portiques.'},
      {f:'Chapiteau dogga situé à la place de la rose des vents.jpg', cap:'La place de la Rose des Vents : un cadran gravé y nommait les douze vents.'},
      {f:'Latrines cyclopes- Dougga.JPG', cap:'Les latrines des Cyclopes — douze sièges en fer à cheval, lieu de sociabilité.'},
      {f:'Thermes de dougga 7.jpg', cap:'Les thermes des Cyclopes, chauffés par hypocauste.'},
      {f:'Dougga capitol from theatre.jpg', cap:'Le Capitole vu depuis le théâtre, dominant la ville.'}
    ],
    'Thermes d\'Antonin':[
      {f:'Antonine baths ruins, Carthage 4.jpg', cap:'Les thermes d\'Antonin en bord de mer — parmi les plus vastes de l\'Empire.'}
    ],
    'Sbeitla (Sufetula)':[
      {f:'L\'entrée du forum de l\'antique ville romaine (Sbeïtla, Tunise) - Flickr - dalbera.jpg', cap:'L\'entrée monumentale du forum de Sufetula et ses trois temples.'}
    ],
    'Bulla Regia':[
      {f:'Forum bulla regia.jpg', cap:'Le forum de Bulla Regia.'},
      {f:'Bulla regia 45.jpg', cap:'Mosaïque d\'une villa souterraine : on s\'enterrait pour fuir la chaleur.'}
    ]
  };

  let slides=[], idx=0, timer=null, playing=true, voiceEl=null;

  fetch('sites.geojson').then(r=>r.json()).then(g=>{
    const by=new Map(g.features.map(f=>[norm(f.properties.nom), f.properties]));
    const built=[...INTROS];
    SEQ.forEach(s=>{ const p=by.get(norm(s.nom)); if(!p) return;
      if(p.photo) built.push({ type:'photo', act:s.act, nom:p.nom, desc:(p.description||'').trim(),
        photo:big(p.photo), credit:p.photo_credit||'', source:p.source||'' });
      (EXTRA[s.nom]||[]).forEach(x=>built.push({ type:'photo', act:s.act, nom:p.nom, desc:x.cap,
        photo:wm(x.f), credit:'Wikimedia Commons', source:p.source||'Wikimedia Commons' })); });
    built.push(OUTRO);
    slides=built; buildDOM(); show(0); play();
  }).catch(()=>{ document.getElementById('loading').textContent=uiT('Impossible de charger l\'immersion (connexion ?).'); });

  function buildDOM(){
    const stage=document.getElementById('stage'); stage.innerHTML='';
    slides.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='slide'+(s.type==='text'?' text':''); d.dataset.i=i;
      if(s.type==='text'){
        d.innerHTML='<div class="cap"><div class="mark">'+s.mark+'</div><h2>'+s.titre+'</h2><p>'+s.texte+'</p></div>';
      } else {
        const bg = s.photo ? 'style="background-image:url(\''+s.photo+'\')"' : 'style="background:#1a140d"';
        d.innerHTML='<div class="bg" '+bg+'></div><div class="veil"></div>'+
          '<div class="cap"><div class="kick">'+s.act+'</div><h2>'+s.nom+'</h2>'+
          (s.desc?'<p>'+(s.desc.length>260?s.desc.slice(0,260)+'…':s.desc)+'</p>':'')+
          '<div class="src">'+[s.credit,s.source].filter(Boolean).join(' · ')+'</div></div>';
      }
      stage.appendChild(d);
    });
  }
  function show(i){
    idx=(i+slides.length)%slides.length;
    [...document.querySelectorAll('.slide')].forEach(el=>el.classList.toggle('on', +el.dataset.i===idx));
    document.getElementById('counter').textContent=(idx+1)+' / '+slides.length;
    // voix narrative (ElevenLabs) si activée et fichier présent
    if(voiceEl){ voiceEl.pause(); voiceEl=null; }
    if(VOICE){ voiceEl=new Audio('voix-rome/'+idx+'.mp3'); voiceEl.play().catch(()=>{}); }
    restart();
  }
  function next(){ show(idx+1); } function prev(){ show(idx-1); }
  function restart(){ clearTimeout(timer); if(playing) timer=setTimeout(next, DURATION); animateBar(); }
  function animateBar(){ const b=document.getElementById('bar'); b.style.transition='none'; b.style.width='0';
    requestAnimationFrame(()=>{ if(!playing){ b.style.width='0'; return; } b.style.transition='width '+DURATION+'ms linear'; b.style.width='100%'; }); }
  function play(){ playing=true; document.getElementById('playpause').textContent='⏸'; restart(); }
  function pause(){ playing=false; document.getElementById('playpause').textContent='▶'; clearTimeout(timer); document.getElementById('bar').style.transition='none'; }

  document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
  document.getElementById('prev').onclick=e=>{e.stopPropagation();prev();};
  document.getElementById('playpause').onclick=e=>{e.stopPropagation(); playing?pause():play();};
  const bgm=document.getElementById('bgm');
  document.getElementById('sound').onclick=e=>{e.stopPropagation();
    if(bgm.paused){ bgm.volume=0.35; bgm.play().then(()=>{document.getElementById('sound').textContent='🔊';}).catch(()=>{ alert(uiT('Ajoutez un fichier « immersion-rome.mp3 » dans le dossier pour la musique de fond.')); }); }
    else { bgm.pause(); document.getElementById('sound').textContent='🔇'; } };
  // tap pour avancer, appui long = pause
  let press=null, moved=false;
  document.getElementById('stage').addEventListener('pointerdown',()=>{ moved=false; press=setTimeout(()=>{pause();press=null;}, 350); });
  document.getElementById('stage').addEventListener('pointermove',()=>{moved=true;});
  document.getElementById('stage').addEventListener('pointerup',()=>{ if(press){ clearTimeout(press); press=null; if(!moved){ if(!playing) play(); else next(); } } else { play(); } });
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')next(); else if(e.key==='ArrowLeft')prev(); else if(e.key===' '){e.preventDefault(); playing?pause():play();} });
</script>
  <script src="analytics.js"></script>
</body>
</html>
